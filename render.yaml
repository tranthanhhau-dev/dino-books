services:
  - type: web
    name: dino-books
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn tiem_sach_bot.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: tiem_sach_bot.settings
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
